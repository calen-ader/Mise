<title>Mise</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030202">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030202;--fg:#ede7dc;--fg2:#9b948a;--rule:#2a2522;--line:#3b3430;--card:#0b0908;
  --paper:#eef0ec;--ink:#15171b;--ink2:#565b62;--prule:#c9cdc7;
  --gl:rgba(237,231,220,.075);--glb:rgba(237,231,220,.15);--glh:inset 0 1px 0 rgba(255,255,255,.14);
  --gut:clamp(16px,3.2vw,48px);--navh:120px;--dot:#e0a050;
  --ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scrollbar-color:var(--line) var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 "Schibsted Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block}
[hidden]{display:none!important}
::selection{background:var(--fg);color:var(--bg)}
input{caret-color:var(--fg)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.num,.count,.q{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* glass: controls that float over photos and scrolling content */
.chip,.fbtn,.pill,.close,.qa,.search,.seg,.strict,.tok,.rvbtn{background:var(--gl);border:1px solid var(--glb);box-shadow:var(--glh);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%)}
@media(hover:hover){.chip:not(:disabled):hover,.fbtn:hover,.pill:hover,.close:hover,.qa:hover,.rvbtn:hover{background:rgba(237,231,220,.13);border-color:rgba(237,231,220,.24)}}

/* navbar */
.top{position:fixed;top:0;left:0;right:0;z-index:20;padding:env(safe-area-inset-top) var(--gut) 0;background:rgba(9,7,6,.6);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border-bottom:1px solid rgba(237,231,220,.08)}
.bar{display:flex;align-items:center;gap:10px;height:62px}
.search{flex:1 1 auto;min-width:0;max-width:560px;display:flex;align-items:center;gap:8px;height:44px;padding:0 4px 0 14px;border-radius:22px;transition:border-color .3s var(--ease)}
.search:focus-within{border-color:rgba(237,231,220,.42)}
.search svg.i{color:var(--fg2)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px;height:100%;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:#8a8278}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search .count{font-size:12.5px;color:var(--fg2);white-space:nowrap;padding-right:8px}
.search .x{border:0;background:none;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--fg2)}
.fbtn{margin-left:auto;flex:none;position:relative;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 13px;border-radius:22px;font-size:14px;font-weight:600}
.fbtn .n{min-width:20px;height:20px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:12px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;flex:none;border-radius:22px;padding:2px;font-size:12px;font-weight:600;letter-spacing:.06em}
.seg button{border:0;background:none;min-width:40px;height:38px;border-radius:19px;padding:0 8px;color:var(--fg2)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
@media(max-width:599px){
  .fbtn{width:44px;padding:0;justify-content:center}.fbtn .lb{display:none}.fbtn .n{position:absolute;top:-5px;right:-5px}
  .top .seg{padding:0}.top .seg button{min-width:42px}
  .top .seg button[aria-pressed=true]{display:none}
}
@media(min-width:1200px){
  .top{display:flex;align-items:center;gap:10px;height:calc(72px + env(safe-area-inset-top))}
  .bar{display:contents}
  .mark{order:0;margin-right:6px}.search{order:1;max-width:340px}
  .top>.chips{order:2;flex:1;min-width:0;margin:0;padding:0 2px;-webkit-mask:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
  .fbtn{order:3;margin-left:0}.top .seg{order:4}
}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 var(--gut) 12px;margin:0 calc(-1*var(--gut));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 15px;font-size:13px;font-weight:500;white-space:nowrap;border-radius:20px;transition:background .25s,border-color .25s}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.ex[aria-pressed=true]{background:rgba(237,231,220,.2);color:var(--fg);border-color:var(--fg);font-weight:600}
.chips .sep{flex:none;width:1px;margin:8px 4px;background:var(--line)}
.chip.tag{background:rgba(237,231,220,.16);display:inline-flex;align-items:center;gap:6px;padding-right:9px}
.chip.tag svg{width:14px;height:14px}
.chip .n{margin-left:7px;color:var(--fg2);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true] .n{color:inherit;opacity:.6}
.chip:disabled{opacity:.35;cursor:default}

/* logo options */
.mark{margin:0;flex:none;display:flex;align-items:baseline;gap:7px;font-family:"Bodoni Moda",Didot,serif;font-optical-sizing:auto;font-weight:400;line-height:1;color:var(--fg)}
[data-logo="1"] .mark{font-style:italic;font-size:31px;letter-spacing:-.02em}
[data-logo="2"] .mark{font-weight:800;font-size:29px;letter-spacing:-.035em}
[data-logo="3"] .mark{font-weight:600;font-size:31px;letter-spacing:-.025em}
.mark .di{position:relative}
.mark .di i{position:absolute;left:50%;top:.33em;width:.19em;height:.19em;border-radius:50%;background:var(--dot);transform:translateX(-50%);transition:background .6s var(--ease)}
[data-logo="4"] .mark{font-weight:500;font-size:17px;letter-spacing:.34em;margin-right:-.34em}
[data-logo="5"] .mark{font-style:italic;font-size:30px;letter-spacing:-.02em}
.mark small{font:500 12px/1 "Schibsted Grotesk",sans-serif;font-style:normal;color:var(--fg2);letter-spacing:.01em}
[data-logo="6"] .mark{width:42px;height:42px;border-radius:21px;justify-content:center;align-items:center;font-style:italic;font-size:25px;padding-bottom:2px;background:var(--fg);color:var(--bg)}

/* grid */
main{padding:calc(var(--navh) + 14px) var(--gut) 140px}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:var(--gy) var(--gx)}
.card{position:relative;min-width:0;--ar:4/5}
.card .open{display:block;width:100%;padding:0;border:0;background:none;text-align:left;color:inherit}
.ph{position:relative;display:block;overflow:hidden;isolation:isolate;aspect-ratio:var(--ar);background:var(--card)}
.ph img{position:absolute;max-width:none;height:auto;width:calc(var(--w)*100%);left:calc(var(--l)*100%);top:calc(var(--t)*100%);mix-blend-mode:lighten;transition:transform .7s var(--ease);transform-origin:50% 60%}
@media(hover:hover){.card .open:hover img{transform:scale(1.035)}.card .open:hover .nm{color:var(--c2)}}
.nm{display:block;font-family:"Bodoni Moda",serif;font-optical-sizing:auto;font-weight:500;line-height:1;letter-spacing:-.015em;text-wrap:balance;transition:color .3s}
.ln{display:block;font-size:12.5px;color:var(--fg2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln b{font-weight:500;color:var(--c2)}
.card{container-type:inline-size}
@container (max-width:210px){.yr{display:none}}
.ph img.fe{-webkit-mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent),linear-gradient(transparent,#000 10%,#000 90%,transparent);-webkit-mask-composite:source-in;mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent) intersect,linear-gradient(transparent,#000 10%,#000 90%,transparent)}
.qa{position:absolute;z-index:2;top:8px;right:8px;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--fg);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;transition:background .25s,color .25s,transform .35s var(--ease)}
.qa::before{content:"";position:absolute;inset:-5px}
.qa svg{width:18px;height:18px}
.qa.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qa.pop{animation:pop .45s var(--ease)}
@keyframes pop{40%{transform:scale(1.18)}}

/* A: backlit tile */
[data-card=a] .grid{--cw:max(150px,13.5vw);--gx:clamp(10px,1.2vw,18px);--gy:clamp(10px,1.2vw,18px)}
[data-card=a] .card{background:var(--card);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(237,231,220,.06)}
[data-card=a] .ph{background:radial-gradient(62% 46% at 50% 50%,color-mix(in srgb,var(--c) 50%,transparent),transparent 74%),var(--card)}
[data-card=a] .tx{display:block;position:relative;margin-top:-30px;padding:0 12px 14px;background:linear-gradient(rgba(11,9,8,0),var(--card) 30px)}
[data-card=a] .nm{font-size:clamp(20px,1.55vw,25px);padding-top:16px}

/* B: plinth, no box, the drink stands on its own light */
[data-card=b] .grid{--cw:max(150px,13vw);--gx:clamp(12px,1.6vw,24px);--gy:clamp(22px,2.4vw,36px)}
[data-card=b] .card{--ar:3/4}
[data-card=b] .ph{background:radial-gradient(48% 9% at 50% 88%,color-mix(in srgb,var(--c) 70%,transparent),transparent 100%),linear-gradient(to top,color-mix(in srgb,var(--c) 26%,transparent),transparent 46%),var(--bg);border-bottom:1px solid color-mix(in srgb,var(--c2) 45%,transparent)}
[data-card=b] .tx{display:block;padding-top:11px}
[data-card=b] .nm{font-size:clamp(21px,1.6vw,26px)}

/* C: contact sheet, three to a phone row */
[data-card=c] .grid{--cw:max(100px,9.5vw);--gx:clamp(6px,.8vw,12px);--gy:clamp(14px,1.6vw,22px)}
[data-card=c] .card{--ar:1/1}
[data-card=c] .ph{border-radius:4px;background:radial-gradient(60% 55% at 50% 55%,color-mix(in srgb,var(--c) 40%,transparent),transparent 76%),var(--card)}
[data-card=c] .tx{display:block;padding-top:7px}
[data-card=c] .nm{font-size:clamp(15px,1.15vw,19px);font-weight:600}
[data-card=c] .ln{font-size:11.5px;margin-top:3px}
[data-card=c] .qa{top:5px;right:5px;width:30px;height:30px;border-radius:15px;font-size:12.5px}
[data-card=c] .qa::before{inset:-7px}
[data-card=c] .qa svg{width:15px;height:15px}

.empty{padding:64px 0;text-align:center}
.empty p{font-family:"Bodoni Moda",serif;font-size:34px;margin:0 0 16px;line-height:1.05}
.pill{height:44px;padding:0 18px;border-radius:22px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg)}
.pill.solid{background:var(--fg);color:var(--bg);border-color:var(--fg);box-shadow:0 10px 30px -14px rgba(0,0,0,.9)}

/* review switcher (temporary) */
.rv{position:fixed;z-index:31;left:var(--gut);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.rvbtn{height:44px;padding:0 16px;border-radius:22px;font-size:13px;font-weight:600;background:rgba(20,17,15,.55)}
.rvp{padding:14px;border-radius:14px;background:rgba(20,17,15,.72);border:1px solid var(--glb);box-shadow:var(--glh),0 20px 40px -20px #000;-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);display:grid;gap:12px;animation:rise .4s var(--ease)}
.rvp h3{margin:0 0 6px;font-size:12.5px;font-weight:500;color:var(--fg2)}
.rvp .seg{letter-spacing:0;font-size:13px}
.rvp .seg button{min-width:44px;padding:0 12px}

/* drink page */
.sheet{position:fixed;inset:0;z-index:40;overflow-y:auto;overscroll-behavior:contain;background:var(--bg)}
.close{position:fixed;z-index:3;top:calc(10px + env(safe-area-inset-top));left:10px;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--fg);background:rgba(20,17,15,.4);transition:transform .35s var(--ease),opacity .35s}
.close.away{transform:translateY(-70px);opacity:0}
.dwrap{max-width:620px;margin:0 auto;position:relative}
.dcol{--px:20px;position:relative;z-index:1}
.plate{position:relative;overflow:hidden;aspect-ratio:4/5}
.plate img{width:100%;height:100%;object-fit:cover;transform:scale(1.05)}
.plate::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 45% at 50% 100%,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%),linear-gradient(180deg,rgba(3,2,2,0) 60%,var(--bg) 100%)}
.head{padding:0 var(--px);margin-top:-23vw}
@media(min-width:620px){.head{margin-top:-140px}}
.head h2{font-family:"Bodoni Moda",serif;font-optical-sizing:auto;font-weight:500;font-size:clamp(54px,17vw,104px);line-height:.88;letter-spacing:-.03em;margin:0;text-wrap:balance}
.head .orig{font-size:13px;margin-top:12px;color:var(--c2);font-weight:500}
.pour{padding:28px var(--px) 6px}
.pour .ln{display:grid;grid-template-columns:4.6em 1fr;align-items:baseline;gap:12px;padding:9px 0;margin:0;font-size:inherit;color:inherit;white-space:normal;overflow:visible}
.pour .q{font-size:15px;font-weight:600}
.pour .i{font-size:16px}
.pour small{display:block;color:var(--fg2);font-size:12.5px}
.pour .opt{color:var(--fg2)}
.ratio{display:flex;gap:3px;height:10px;margin:0 0 14px}
.ratio i{background:var(--c2);border-radius:1px}
.add{margin:18px var(--px) 0;width:calc(100% - 2*var(--px));justify-content:center;height:52px;border-radius:26px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);margin:22px 0 0;padding:6px var(--px) 0;border-top:1px solid var(--rule)}
.facts div{padding:12px 0}
.facts dt{color:var(--fg2);font-size:13px;margin-bottom:2px}
.facts dd{margin:0;font-size:15px;font-weight:500}
.prose{padding:22px var(--px) 120px}
.prose h3{color:var(--fg2);font-size:13px;font-weight:500;margin:0 0 6px}
.prose p{margin:0 0 22px;max-width:62ch}
@media(min-width:960px){
  .dwrap{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .plate{position:sticky;top:0;height:100dvh;aspect-ratio:auto}
  .plate::after{background:radial-gradient(80% 40% at 50% 100%,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%),linear-gradient(90deg,rgba(3,2,2,0) 72%,var(--bg))}
  .dcol{--px:clamp(28px,4vw,72px);max-width:680px}
  .head{margin-top:0;padding-top:max(88px,16vh)}
  .head h2{font-size:clamp(64px,6.4vw,104px)}
}

/* the ticket: the one light object in a dark room */
.tab{position:fixed;z-index:30;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;height:48px;padding:0 18px 0 16px;border:0;background:var(--paper);color:var(--ink);font-weight:600;font-size:14px;box-shadow:0 10px 30px -8px rgba(0,0,0,.8);
  -webkit-mask:radial-gradient(circle at 0 6px,transparent 3px,#000 3.5px) 0 0/51% 12px repeat-y,radial-gradient(circle at 100% 6px,transparent 3px,#000 3.5px) 100% 0/51% 12px repeat-y;
  mask:radial-gradient(circle at 0 6px,transparent 3px,#000 3.5px) 0 0/51% 12px repeat-y,radial-gradient(circle at 100% 6px,transparent 3px,#000 3.5px) 100% 0/51% 12px repeat-y}
.tab .n{font-family:"Bodoni Moda",serif;font-size:22px;font-weight:600;line-height:1}
.tab.bump{animation:bump .5s var(--ease)}
@keyframes bump{0%{transform:translate(-50%,0)}30%{transform:translate(-50%,-6px)}100%{transform:translate(-50%,0)}}
.cmd{position:fixed;inset:0;z-index:50;overflow-y:auto;overscroll-behavior:contain;background:rgba(3,2,2,.7);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(64px + env(safe-area-inset-top)) 14px 40px}
.slip{max-width:440px;margin:0 auto;background:var(--paper);color:var(--ink);padding:26px 20px 34px;position:relative;
  -webkit-mask:linear-gradient(#000,#000) 0 10px/100% calc(100% - 20px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,transparent 0) 0 0/14px 10px repeat-x,conic-gradient(from 135deg at 50% 0,#000 90deg,transparent 0) 0 100%/14px 10px repeat-x;
  mask:linear-gradient(#000,#000) 0 10px/100% calc(100% - 20px) no-repeat,conic-gradient(from -45deg at 50% 100%,#000 90deg,transparent 0) 0 0/14px 10px repeat-x,conic-gradient(from 135deg at 50% 0,#000 90deg,transparent 0) 0 100%/14px 10px repeat-x}
.slip.print{animation:print .9s var(--ease) both}
@keyframes print{from{clip-path:inset(0 0 100% 0);transform:translateY(-24px)}to{clip-path:inset(0 0 0 0);transform:none}}
.slip ::selection{background:var(--ink);color:var(--paper)}
.slip :focus-visible{outline-color:var(--ink)}
.s-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:14px;border-bottom:1.5px solid var(--ink)}
.s-head h2{font-family:"Bodoni Moda",serif;font-optical-sizing:auto;font-weight:600;font-size:40px;line-height:1;letter-spacing:-.02em;margin:0}
.s-head span{font-size:13px;color:var(--ink2)}
.s-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dotted var(--prule)}
.s-row .nm{font-family:"Bodoni Moda",serif;font-optical-sizing:auto;font-weight:600;font-size:22px;line-height:1.05;border:0;background:none;padding:0;text-align:left}
.s-row small{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px}
.step{display:flex;align-items:center;border:1px solid var(--ink);border-radius:22px;height:40px}
.step button{width:40px;height:38px;border:0;background:none;display:grid;place-items:center}
.step output{min-width:22px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.s-sec{margin-top:24px}
.s-sec h3{font-size:13px;font-weight:600;margin:0 0 4px;padding-bottom:6px;border-bottom:1.5px solid var(--ink)}
.s-sec table{width:100%;border-collapse:collapse}
.s-sec td{padding:7px 0;border-bottom:1px dotted var(--prule);vertical-align:baseline;font-size:15px}
.s-sec td.q{width:7.2em;padding-right:10px;font-weight:600}
.s-sec td.r{text-align:right;color:var(--ink2);font-size:13px;width:3em}
.s-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.s-foot .tot{font-size:13px;color:var(--ink2)}
.s-foot button{border:1px solid var(--ink);background:none;height:40px;padding:0 16px;border-radius:20px;font-weight:600;font-size:13px}

/* filters: bottom sheet on phones, side panel on wide screens */
.fs{position:fixed;inset:0;z-index:45;background:rgba(3,2,2,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.fpanel{width:100%;max-width:600px;max-height:calc(100dvh - 40px - env(safe-area-inset-top));display:flex;flex-direction:column;background:rgba(18,15,13,.82);-webkit-backdrop-filter:blur(30px) saturate(160%);backdrop-filter:blur(30px) saturate(160%);border-radius:18px 18px 0 0;border:1px solid var(--glb);border-bottom:0;box-shadow:var(--glh);animation:rise .5s var(--ease)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:900px){.fs{justify-content:flex-end;align-items:stretch}.fpanel{max-width:460px;max-height:none;border-radius:0;border:0;border-left:1px solid var(--glb);animation-name:slide}}
.fhead{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 10px 20px;border-bottom:1px solid var(--rule)}
.fhead h2{font-family:"Bodoni Moda",serif;font-optical-sizing:auto;font-weight:500;font-size:34px;line-height:1;margin:0;letter-spacing:-.02em}
.fhead .acts{display:flex;align-items:center;gap:4px}

.tokin{width:100%;height:44px;border:0;border-bottom:1px solid var(--line);background:none;outline:0;font-size:16px;padding:0 2px}

.video{display:flex;flex-direction:column;align-items:flex-start;gap:10px}

const T = {

   bases:{gin:'Gin',vodka:'Vodka',rum:'Ron',agave:'Agave',whisky:'Whisky',brandy:'Brandy',wine:'Vino',liqueur:'Licor'},

};
const t = () => T[lang];
const L = o => o ? (o[lang] || o.en) : '';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const ICON = {
  back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  close:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  play:'<svg class="i" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',
  plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',
  check:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  slip:'<svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L6 21z"/><path d="M9 8h6M9 12h6"/></svg>'
};

/* ---- model (same rules as the live finder) ---- */
const SPIRIT = {gin:['gin','old-tom-gin'],vodka:['vodka','vodka-citron','vodka-vanilla'],
  rum:['white-rum','gold-rum','aged-rum','dark-rum','black-rum','demerara-rum','martinique-rum','overproof-rum','aguardiente','cachaca'],
  agave:['tequila','tequila-reposado','mezcal'],whisky:['bourbon','rye','scotch','islay','irish'],brandy:['cognac','brandy','calvados','pisco','grappa']};
const ID2SP = {}; Object.entries(SPIRIT).forEach(([g,ids])=>ids.forEach(i=>ID2SP[i]=g));
const BASES = ['gin','vodka','rum','agave','whisky','brandy','wine','liqueur'];
const ALLERGY = Object.keys(COMP).filter(k=>COMP[k].quick);
const VEGAN = ['egg','milk','honey','fish'];
const PANTRY = new Set(['water','sugar','sugar-cube','simple','soda','salt','pepper']);
const FACETS = [ // key, values, drink -> values
 ['base', BASES, d=>[d.base]],
 ['flav', ['sour','sweet','bitter','spirit','fruity','fresh','creamy','sparkling','herbal','smoky','spicy','tropical','minty','coffee','savoury','silky','nutty','floral','dry'], d=>d.flav||[]],
 ['str', ['light','mid','strong'], d=>[d.str]],
 ['tech', ['shake','stir','build','blend','muddle','swizzle'], d=>d.tech],
 ['ggroup', ['stem','low','tall','flute','wine','mug'], d=>[d.ggroup]],
 ['ice', ['up','cubes','crushed','cracked','blended','none','hot'], d=>[d.ice]],
 ['purpose', ['aperitivo','refrescante','digestivo'], d=>d.purpose?[d.purpose]:[]],
 ['cat', ['unforgettables','contemporary','newera'], d=>[d.cat]],
 ['era', ['pre','early','mid','now'], d=>[d.era]],
];
function lineVol(l){
  const n = parseFloat(String(l.q).split(/[-/]/)[0]) || (l.q===''?1:0);
  const m = {ml:1,dash:.8,'bar spoon':5,teaspoon:5,tablespoon:15,drops:.05};
  if (l.u==='ml'){ const q=String(l.q); if(q.includes('-')){const [a,b]=q.split('-').map(parseFloat);return (a+b)/2;} return parseFloat(q)||0; }
  if (l.u==='top up') return 60; if (l.u==='fill up') return 100; if (l.u==='splash') return 20; if (l.u==='shot') return 30;
  if (l.u==='piece') return {'lime-fruit':25,'egg-white':30}[l.ids[0]]||0;
  if (l.u in m) return n*m[l.u]; return 0;
}
function compsOf(ids){ const out={}; ids.forEach(id=>{ const g=ING[id]; if(!g) return;
  Object.entries(g.c).forEach(([c,lv])=>{ let k=c; while(k){ out[k]=Math.max(out[k]||0,lv); k=COMP[k]&&COMP[k].parent; } }); }); return out; }
function lift(hex, k){ const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)); return '#'+c.map(v=>Math.round(v+(255-v)*k).toString(16).padStart(2,'0')).join(''); }
const DR = DATA.drinks.map(dr=>{
  dr.lines.forEach(l=>{ l.vol=l.opt?0:lineVol(l); l.c=compsOf(l.ids); });
  dr.lev={}; dr.via={}; dr.optLev={};
  dr.lines.forEach(l=>Object.entries(l.c).forEach(([c,lv])=>{
    if (l.opt){ dr.optLev[c]=Math.max(dr.optLev[c]||0,lv); return; }
    dr.lev[c]=Math.max(dr.lev[c]||0,lv); (dr.via[c]=dr.via[c]||[]).push({id:l.ids[0],lv}); }));
  if (dr.lines.some(l=>!l.opt && l.ids.some(i=>!ING[i]))) dr.lev.__unknown=1;
  dr.idset = new Set(dr.lines.filter(l=>!l.opt).flatMap(l=>l.ids));
  let best=null,bestSp=null;
  dr.lines.forEach(l=>{ if(l.opt) return; const g=ING[l.ids[0]]; if(!g||!g.abv) return; const a=l.vol*g.abv;
    const grp=ID2SP[l.ids[0]]||(g.kind==='wine'?'wine':'liqueur'); if(!best||a>best.a) best={a,g:grp}; if(ID2SP[l.ids[0]]&&(!bestSp||a>bestSp.a)) bestSp={a,g:grp}; });
  dr.base = bestSp&&best&&bestSp.a>=.4*best.a ? bestSp.g : (best?best.g:'liqueur');
  dr.col = COLORS[dr.id] || '#8a6a4a'; dr.c2 = lift(dr.col,.28);
  dr.nIng = dr.lines.filter(l=>!l.opt && l.ids[0]!=='water').length;
  dr.era = dr.year<1900?'pre':dr.year<1946?'early':dr.year<2000?'mid':'now';
  dr.str = dr.abv<12?'light':dr.abv<=22?'mid':'strong';
  dr.ggroup = GLASS[dr.glass] ? GLASS[dr.glass].g : 'stem';
  const f = new Set(dr.flav||[]);
  dr.purpose = (dr.ggroup==='tall' || dr.vol>=150) ? 'refrescante'
    : (f.has('bitter') || f.has('dry')) ? 'aperitivo'
    : (f.has('creamy') || f.has('coffee') || (f.has('sweet') && !f.has('sour'))) ? 'digestivo'
    : (f.has('sparkling') && dr.abv<15) ? 'refrescante'
    : (f.has('spirit') || f.has('herbal')) ? 'aperitivo' : null;
  dr.search = (dr.name+' '+dr.lines.flatMap(l=>l.ids.map(i=>ING[i]?ING[i].en+' '+ING[i].es:i)).join(' ')).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  return dr;
});
const byId = Object.fromEntries(DR.map(d=>[d.id,d]));
Object.keys(ticket).forEach(k=>{ if(!byId[k]) delete ticket[k]; });
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
// level 1 declared only, 2 + common, 3 + possible (and unknown bottles)
const blocked = (d, comps) => comps.some(c => (d.lev[c]||0) >= 4-S.level || (S.level===3 && d.lev.__unknown));
function pass(d, skip){
  if (Q){ const ws=norm(Q).split(/\s+/).filter(Boolean); if(!ws.every(w=>d.search.includes(w))) return false; }
  const ex = S.leave.concat(S.vegan?VEGAN:[]);
  if (ex.length && blocked(d, ex)) return false;
  for (const tk of S.toks){
    const has = tk.type==='ing' ? d.idset.has(tk.id) || (SPIRIT[tk.id]||[]).some(i=>d.idset.has(i)) : (d.lev[tk.id]||0) >= (tk.mode==='exc' ? 4-S.level : 3);
    if (tk.mode==='inc' && !S.mybar && !has) return false;
    if (tk.mode==='exc' && has) return false;
  }
  if (S.mybar){
    const have = new Set(S.toks.filter(x=>x.mode==='inc'&&x.type==='ing').flatMap(x=>SPIRIT[x.id]||[x.id]));
    if (!d.lines.every(l=>l.opt || PANTRY.has(l.ids[0]) || l.ids.some(i=>have.has(i)))) return false;
  }
  for (const [k,,get] of FACETS){ if (k===skip || !S[k].length) continue; if (!get(d).some(v=>S[k].includes(v))) return false; }
  return true;
}
const facetCount = (k, v, get) => DR.filter(d=>pass(d,k) && get(d).includes(v)).length;
const activeCount = () => S.leave.length + (S.vegan?1:0) + S.toks.length + (S.mybar?1:0) + FACETS.reduce((n,[k])=>n+S[k].length,0);
const SORTS = {az:(a,b)=>a.name.localeCompare(b.name), light:(a,b)=>a.abv-b.abv, strong:(a,b)=>b.abv-a.abv, old:(a,b)=>a.year-b.year, new:(a,b)=>b.year-a.year, few:(a,b)=>a.nIng-b.nIng||a.name.localeCompare(b.name)};
const results = () => DR.filter(d=>pass(d)).sort(SORTS[sort]||SORTS.az);
const uName = u => UNIT[u] ? UNIT[u][lang==='es'?1:0] : u;
function toOz(x){ const v=Math.round(x/30*4)/4, w=Math.floor(v), fr={0:'',0.25:'¼',0.5:'½',0.75:'¾'}[v-w]; return (w||!fr?w:'')+fr; }
function fmtQty(l){ if (l.u==='ml') return units==='oz' ? String(l.q).split('-').map(x=>toOz(parseFloat(x))).join('–')+' oz' : String(l.q).replace('-','–')+' ml'; if (!l.q) return uName(l.u); return `${l.q} ${uName(l.u)}`.trim(); }
const ingName = id => ING[id]?L(ING[id]):id;
const lineLabel = l => l.ids.map(ingName).join(` ${t().or} `);
const techStr = d => d.tech.map(x=>t().techs[x]).join(' + ');
const glassName = d => GLASS[d.glass]?L(GLASS[d.glass]):d.glass;
const metaLine = d => [t().bases[d.base], techStr(d), Math.round(d.abv)+'%'].join(' · ');
const photo = d => `photos/${d.id}.webp`;

/* ---- review variants (temporary, until Fede picks) ---- */
const qp = new URLSearchParams(location.search);
let CARD = qp.get('card') || store.get('rev.card','a'); let LOGO = qp.get('logo') || store.get('rev.logo','1'); let rvOpen = false;
const CARDS = {a:{ar:4/5,f:.6,cy:.47,name:'Backlit'}, b:{ar:3/4,f:.72,cy:.52,name:'Plinth'}, c:{ar:1,f:.74,cy:.5,name:'Sheet'}};
// place the photo so the glass fills f of the box height, centred at (.5, cy); never shows past the photo's edges
function crop(d){
  const v=CARDS[CARD], A=v.ar, [x0,y0,x1,y1]=FRAMES[d.id]||[.3,.3,.7,.85];
  let W = v.f/(A*1.5*Math.max(.2,y1-y0));
  W = Math.min(W, .82/Math.max(.1,x1-x0));
  // a tall glass may need the photo smaller than the box: then its edges are feathered into the card
  const cover = Math.max(1, 1/(1.5*A)), fe = W < cover; W = Math.max(W, cover*.78);
  const H = 1.5*W, bh = 1/A, cl = (x,a,b) => Math.min(Math.max(x,Math.min(a,b)),Math.max(a,b));
  const l = cl(.5-(x0+x1)/2*W, 0, 1-W);
  const tp = cl(v.cy*bh-(y0+y1)/2*H, 0, bh-H);
  return `${fe?'fe':''}" style="--w:${W.toFixed(3)};--l:${l.toFixed(3)};--t:${(tp/bh).toFixed(3)}`;
}

/* ---- the ticket (comanda): drinks × covers -> mise en place ---- */
function miseEnPlace(){
  const ml={}, units={}, glass={}, garn=[]; let drinks=0;
  Object.entries(ticket).forEach(([id,n])=>{ const d=byId[id]; drinks+=n;
    glass[glassName(d)]=(glass[glassName(d)]||0)+n;
    if (L(d.garnish)) garn.push([L(d.garnish), n]);
    d.lines.forEach(l=>{ if(l.opt) return; const k=l.ids[0];
      if (l.u==='ml'){ ml[k]=(ml[k]||0)+l.vol*n; return; }
      // spoons share one measure so the same ingredient adds up on one line
      const sp = {teaspoon:1,'bar spoon':1,tablespoon:3}[l.u]; const u = sp ? 'bar spoon' : l.u;
      const key=k+'|'+u; const q=parseFloat(String(l.q).split(/[-/]/)[0]);
      units[key]=(units[key]||0)+(isNaN(q)?1:q)*(sp||1)*n; });
  });
  return {ml, units, glass, garn, drinks};
}

  const un=e.target.closest('[data-u]'); if(un){ units=un.dataset.u; store.set('units',units); open(openId,false); return; }
  const a=e.target.closest('[data-add]'); if(a){ const id=a.dataset.add; setCovers(id, (ticket[id]||0)+1); if(a.dataset.quick) markCard(id,true); else open(id,false); renderTab(true); return; }
  const rv=e.target.closest('[data-rv]'); if(rv){ const [k,v]=rv.dataset.rv.split(':'); if(k==='card'){ CARD=v; store.set('rev.card',v); } else { LOGO=v; store.set('rev.logo',v); } renderChrome(); renderList(); return; }
  if(e.target.closest('[data-rvtoggle]')){ rvOpen=!rvOpen; renderRev(); return; }
  const st=e.target.closest('[data-step]'); if(st){ setCovers(st.dataset.step, (ticket[st.dataset.step]||0)+(+st.dataset.dv)); renderTicket(false); return; }
  if(e.target.closest('#tab')){ openTicket(); return; }
  if(e.target.closest('#ccls')){ closeTicket(); return; }
  if(e.target.closest('#cclr')){ ticket={}; store.set('ticket',ticket); renderList(); closeTicket(); return; }
  const o=e.target.closest('[data-id]'); if(o){ open(o.dataset.id); return; }
  if(e.target.closest('#cls')){ close(); return; }
  if(e.target.closest('#clr')){ S=blank(); Q=''; saveS(); $('#q').value=''; $('#qx').hidden=true; all(); return; }
  const l=e.target.closest('[data-l]'); if(l){ lang=l.dataset.l; store.set('lang',lang); all(); return; }
  if(e.target===$('#cmd')) closeTicket();
});
$('#q').addEventListener('input', e=>{ Q=e.target.value; $('#qx').hidden=!Q; renderList(); });
$('#qx').addEventListener('click', e=>{ e.preventDefault(); Q=''; $('#q').value=''; $('#qx').hidden=true; renderList(); $('#q').focus(); });
document.addEventListener('input', e=>{ if(e.target.id==='tokin') suggest(); });
document.addEventListener('securitypolicyviolation', e=>{ if(!/frame/.test(e.violatedDirective)) return; const f=document.querySelector('.video iframe'); if(f) f.remove(); });
document.addEventListener('change', e=>{ if(e.target.id==='mybar'){ S.mybar=e.target.checked; changed(); } });
document.addEventListener('keydown', e=>{ if(e.target.id==='tokin' && e.key==='Enter'){ const f=$('#sugg button'); if(f){ e.preventDefault(); f.click(); } } });
document.addEventListener('keydown', e=>{ if(e.key!=='Escape') return; if(!$('#fs').hidden) closeFilters(); else if(!$('#cmd').hidden) closeTicket(); else if(openId) close(); });
let lastY=0; $('#sheet').addEventListener('scroll', e=>{ const y=e.target.scrollTop, c=$('#cls'); if(c) c.classList.toggle('away', y>lastY && y>120); lastY=y; }, {passive:true});
addEventListener('popstate', ()=>{ if(!$('#fs').hidden) closeFilters(true); else if(!$('#cmd').hidden) closeTicket(true); else if(openId) close(true); });
if ('ResizeObserver' in window) new ResizeObserver(()=>document.documentElement.style.setProperty('--navh', $('#top').offsetHeight+'px')).observe($('#top'));
let wasNarrow = innerWidth<600; addEventListener('resize', ()=>{ if((innerWidth<600)!==wasNarrow){ wasNarrow=!wasNarrow; renderChrome(); } });
all();
const h=location.hash.slice(1); if (h in byId) open(h,false); else if ((h==='ticket'||h==='comanda') && Object.keys(ticket).length) openTicket(false);
</script>
