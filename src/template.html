<title>Mise</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030202">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030202;--fg:#ede7dc;--fg2:#9b948a;--rule:#2a2522;--line:#3b3430;--card:#0b0908;
  --paper:#eef0ec;--ink:#15171b;--ink2:#565b62;--prule:#c9cdc7;
  --gl:rgba(237,231,220,.075);--glb:rgba(237,231,220,.15);--glh:inset 0 1px 0 rgba(255,255,255,.14);
  --gut:clamp(16px,3.2vw,48px);--navh:120px;--dot:#e0a050;
  --ease:cubic-bezier(.16,1,.3,1);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scrollbar-color:var(--line) var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.45 "Schibsted Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
img{display:block}
[hidden]{display:none!important}
::selection{background:var(--fg);color:var(--bg)}
input{caret-color:var(--fg)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.num,.count,.q{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* glass: controls that float over photos and scrolling content */
.chip,.fbtn,.pill,.close,.qa,.gbtn,.search,.seg,.strict,.tok,.rvbtn{background:var(--gl);border:1px solid var(--glb);box-shadow:var(--glh);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%)}
@media(hover:hover){.chip:not(:disabled):hover,.fbtn:hover,.pill:hover,.close:hover,.qa:hover,.gbtn:not(.solid):hover,.rvbtn:hover{background:rgba(237,231,220,.13);border-color:rgba(237,231,220,.24)}}

/* navbar */
.top{position:fixed;top:0;left:0;right:0;z-index:20;padding:env(safe-area-inset-top) var(--gut) 0;background:rgba(9,7,6,.6);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border-bottom:1px solid rgba(237,231,220,.08)}
.bar{display:flex;align-items:center;gap:10px;height:62px}
.search{flex:1 1 auto;min-width:0;max-width:560px;display:flex;align-items:center;gap:8px;height:44px;padding:0 4px 0 14px;border-radius:22px;transition:border-color .3s var(--ease)}
.search:focus-within{border-color:rgba(237,231,220,.42)}
.search svg.i{color:var(--fg2)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;font-size:16px;height:100%;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:#8a8278}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search .count{font-size:12.5px;color:var(--fg2);white-space:nowrap;padding-right:8px}
.search .x{border:0;background:none;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--fg2)}
.fbtn{margin-left:auto;flex:none;position:relative;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 13px;border-radius:22px;font-size:14px;font-weight:600}
.fbtn .n{min-width:20px;height:20px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:12px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;flex:none;border-radius:22px;padding:2px;font-size:12px;font-weight:600;letter-spacing:.06em}
.seg button{border:0;background:none;min-width:40px;height:38px;border-radius:19px;padding:0 8px;color:var(--fg2)}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
@media(max-width:599px){
  .fbtn{width:44px;padding:0;justify-content:center}.fbtn .lb{display:none}.fbtn .n{position:absolute;top:-5px;right:-5px}
  .top .seg{padding:0}.top .seg button{min-width:42px}
  .top .seg button[aria-pressed=true]{display:none}
}
@media(min-width:1200px){
  .top{display:flex;align-items:center;gap:10px;height:calc(72px + env(safe-area-inset-top))}
  .bar{display:contents}
  .mark{order:0;margin-right:6px}.search{order:1;max-width:340px}
  .top>.chips{order:2;flex:1;min-width:0;margin:0;padding:0 2px;-webkit-mask:linear-gradient(90deg,#000 calc(100% - 32px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 32px),transparent)}
  .fbtn{order:3;margin-left:0}.top .seg{order:4}
}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 var(--gut) 12px;margin:0 calc(-1*var(--gut));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 15px;font-size:13px;font-weight:500;white-space:nowrap;border-radius:20px;transition:background .25s,border-color .25s}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.ex[aria-pressed=true]{background:rgba(237,231,220,.2);color:var(--fg);border-color:var(--fg);font-weight:600}
.chips .sep{flex:none;width:1px;margin:8px 4px;background:var(--line)}
.chip.tag{background:rgba(237,231,220,.16);display:inline-flex;align-items:center;gap:6px;padding-right:9px}
.chip.tag svg{width:14px;height:14px}
.chip .n{margin-left:7px;color:var(--fg2);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed=true] .n{color:inherit;opacity:.6}
.chip:disabled{opacity:.35;cursor:default}

/* logo: tracked capitals */
.mark{margin:0 -.34em 0 0;flex:none;font-family:"Bodoni Moda",Didot,serif;font-optical-sizing:auto;font-weight:500;font-size:17px;letter-spacing:.34em;line-height:1;color:var(--fg)}
.flying .mark{opacity:0}

/* ---------- shared item pieces ---------- */
@property --gi{syntax:'<number>';inherits:true;initial-value:50}
main{padding:calc(var(--navh) + 18px) var(--gut) 140px}
.cards{list-style:none;margin:0;padding:0}
.card{position:relative;min-width:0;container-type:inline-size;--gi:50;transition:--gi .7s var(--ease)}
.card .open{display:block;width:100%;padding:0;border:0;background:none;text-align:left;color:inherit}
.fr,.flip{display:block;position:relative}
.ph{position:relative;display:block;overflow:hidden;isolation:isolate;aspect-ratio:var(--ar,4/5);background:var(--card)}
.ph img{position:absolute;max-width:none;height:auto;width:calc(var(--w)*100%);left:calc(var(--l)*100%);top:calc(var(--t)*100%);mix-blend-mode:lighten;transition:transform .8s var(--ease);transform-origin:50% 60%}
.ph img.fe{-webkit-mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent),linear-gradient(transparent,#000 10%,#000 90%,transparent);-webkit-mask-composite:source-in;mask:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent) intersect,linear-gradient(transparent,#000 10%,#000 90%,transparent)}
.nm{display:block;font-family:"Bodoni Moda",serif;font-optical-sizing:auto;font-weight:500;line-height:1;letter-spacing:-.015em;text-wrap:balance;transition:color .3s,transform .6s var(--ease)}
.ln{display:block;font-size:12.5px;color:var(--fg2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln b{font-weight:500;color:var(--c2)}
@container (max-width:230px){.yr{display:none}}
.glow{background:radial-gradient(62% 48% at 50% 50%,color-mix(in srgb,var(--c) calc(var(--gi)*1%),transparent),transparent 74%),var(--card)}
/* the spec, revealed on hover */
.more{position:absolute;z-index:1;left:8px;right:8px;bottom:8px;padding:10px 12px;border-radius:8px;background:rgba(14,12,11,.5);border:1px solid var(--glb);box-shadow:var(--glh);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);display:grid;gap:3px;font-size:12px;line-height:1.3;opacity:0;transform:translateY(14px);transition:opacity .35s var(--ease),transform .55s var(--ease);pointer-events:none}
.more b,.tsp b{font-weight:600;color:var(--c2);font-variant-numeric:tabular-nums}
.gl{color:var(--fg2);margin-top:4px}
.tsp{display:none}
.tsp>span{display:block}
@media(hover:hover){
  .card:hover{--gi:88}
  .card .open:hover .more,.card .open:focus-visible .more{opacity:1;transform:none}
  .card .open:hover img{transform:scale(1.045)}
  .card .open:hover .nm{color:var(--c2)}
}
@media(hover:none){.more{display:none}}
.qa{position:absolute;z-index:2;top:8px;right:8px;width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--fg);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;transition:background .25s,color .25s,transform .35s var(--ease)}
.qa::before{content:"";position:absolute;inset:-5px}
.qa svg{width:18px;height:18px}
.qa.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.qa.pop{animation:pop .45s var(--ease)}
.qa:active,.gbtn:active,.chip:active,.pill:active{transform:scale(.94)}
@keyframes pop{40%{transform:scale(1.25)}}
.gbtn{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--fg);transition:transform .3s var(--ease)}
.gbtn.big{width:60px;height:60px;border-radius:30px}
.gbtn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.fly{position:fixed;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;z-index:60;pointer-events:none}
.ratio.mini{height:5px;gap:2px;margin:0 0 9px}

/* ---------- 10 card styles ---------- */
/* 1 Backlit */
[data-card="1"] .card{background:var(--card);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(237,231,220,.06)}
[data-card="1"] .tx{display:block;position:relative;margin-top:-30px;padding:16px 12px 14px;background:linear-gradient(rgba(11,9,8,0),var(--card) 30px)}
[data-card="1"] .nm{font-size:clamp(20px,9cqw,28px)}
[data-card="1"] .more{bottom:34px}
/* 2 Plinth */
[data-card="2"] .ph{background:radial-gradient(48% 9% at 50% 88%,color-mix(in srgb,var(--c) calc(var(--gi)*1.3%),transparent),transparent 100%),linear-gradient(to top,color-mix(in srgb,var(--c) calc(var(--gi)*.5%),transparent),transparent 46%),var(--bg);border-bottom:1px solid color-mix(in srgb,var(--c2) 45%,transparent)}
[data-card="2"] .tx{display:block;padding-top:11px}
[data-card="2"] .nm{font-size:clamp(21px,9.5cqw,28px)}
/* 3 Sheet */
[data-card="3"] .ph{border-radius:4px}
[data-card="3"] .tx{display:block;padding-top:8px}
[data-card="3"] .nm{font-size:clamp(17px,8.5cqw,24px);font-weight:600}
/* 4 Poster */
[data-card="4"] .card{border-radius:4px;overflow:hidden}
[data-card="4"] .tx{position:absolute;z-index:1;left:0;right:0;bottom:0;padding:48px 14px 14px;background:linear-gradient(rgba(3,2,2,0),rgba(3,2,2,.88) 60%);pointer-events:none}
[data-card="4"] .nm{font-size:clamp(30px,14cqw,58px);font-style:italic;line-height:.9;letter-spacing:-.035em}
[data-card="4"] .ln{max-height:0;opacity:0;transition:max-height .5s var(--ease),opacity .4s}
[data-card="4"] .more{display:none}
@media(hover:hover){[data-card="4"] .card:hover .ln{max-height:20px;opacity:1}[data-card="4"] .card:hover .nm{transform:translateY(-4px)}}
@media(hover:none){[data-card="4"] .ln{max-height:none;opacity:1}}
/* 5 Spec */
[data-card="5"] .card{background:var(--card);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(237,231,220,.06)}
[data-card="5"] .fr{display:grid;grid-template-columns:42% 1fr}
[data-card="5"] .tx{display:flex;flex-direction:column;padding:14px 14px 14px 6px;min-width:0}
[data-card="5"] .nm{font-size:clamp(21px,7cqw,30px);padding-right:36px}
[data-card="5"] .tsp{display:block;margin-top:auto;padding-top:12px;font-size:12.5px;line-height:1.35}
[data-card="5"] .more{display:none}
/* 6 Frosted */
[data-card="6"] .card{border-radius:12px;overflow:hidden}
[data-card="6"] .ph{border-radius:12px}
[data-card="6"] .tx{position:absolute;z-index:1;left:8px;right:8px;bottom:8px;padding:11px 12px 12px;border-radius:8px;background:rgba(40,34,30,.3);border:1px solid var(--glb);box-shadow:var(--glh);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);pointer-events:none}
[data-card="6"] .nm{font-size:clamp(19px,8.5cqw,26px)}
[data-card="6"] .tsp{display:grid;max-height:0;opacity:0;overflow:hidden;font-size:12px;line-height:1.3;transition:max-height .6s var(--ease),opacity .4s,margin .6s var(--ease)}
[data-card="6"] .more{display:none}
@media(hover:hover){[data-card="6"] .card:hover .tsp{max-height:110px;opacity:1;margin-top:9px}}
/* 7 Coaster */
[data-card="7"] .ph{border-radius:50%;margin:13%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) calc(var(--gi)*1%),transparent),transparent),var(--card);box-shadow:0 0 0 1px color-mix(in srgb,var(--c2) 35%,transparent)}
.ring{position:absolute;left:0;top:0;width:100%;height:auto;aspect-ratio:1;pointer-events:none;fill:var(--fg2);font:600 5.2px "Schibsted Grotesk",sans-serif;transition:transform 1.4s var(--ease),fill .4s}
[data-card="7"] .tx{display:block;text-align:center;margin-top:8px}
[data-card="7"] .nm{font-size:clamp(19px,9cqw,26px)}
[data-card="7"] .ln{display:none}
[data-card="7"] .more{display:none}
[data-card="7"] .qa{top:6%;right:6%}
@media(hover:hover){[data-card="7"] .card:hover .ring{transform:rotate(60deg);fill:var(--c2)}}
/* 8 Label */
[data-card="8"] .ph{background:radial-gradient(60% 50% at 50% 55%,color-mix(in srgb,var(--c) calc(var(--gi)*1%),transparent),transparent 75%),var(--bg)}
[data-card="8"] .tx{display:block;position:relative;z-index:1;margin:-20px 9% 0;padding:13px 10px 12px;text-align:center;background:var(--paper);color:var(--ink);outline:1px solid var(--ink);outline-offset:-5px;box-shadow:0 16px 30px -18px #000;transition:transform .6s var(--ease)}
[data-card="8"] .nm{font-size:clamp(17px,8cqw,23px);font-weight:600;color:var(--ink)}
[data-card="8"] .ln{color:var(--ink2);font-size:9.5px;font-weight:600;letter-spacing:.2em;line-height:1.5;text-transform:uppercase;margin-top:7px;white-space:normal}
[data-card="8"] .ln b{color:var(--ink)}
[data-card="8"] .more{bottom:28px}
@media(hover:hover){[data-card="8"] .card:hover .tx{transform:rotate(-1.6deg) translateY(-3px)}[data-card="8"] .card .open:hover .nm{color:var(--ink)}}
/* 9 Flip */
[data-card="9"] .flip{transform-style:preserve-3d;transition:transform .9s var(--ease)}
[data-card="9"] .ph,[data-card="9"] .bk{-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:6px}
[data-card="9"] .bk{position:absolute;inset:0;transform:rotateY(180deg);display:flex;flex-direction:column;justify-content:flex-end;gap:3px;padding:14px;font-size:12.5px;line-height:1.35;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 60%,#0b0908),#0b0908 75%);box-shadow:inset 0 0 0 1px rgba(237,231,220,.1)}
.bk{display:none}
[data-card="9"] .bk b{color:var(--c2);font-weight:600}
.bkn{font:500 26px/1 "Bodoni Moda",serif;letter-spacing:-.02em;margin-bottom:auto}
[data-card="9"] .tx{display:block;padding-top:10px}
[data-card="9"] .nm{font-size:clamp(20px,9cqw,27px)}
[data-card="9"] .more{display:none}
@media(hover:hover){[data-card="9"] .card:hover .flip,[data-card="9"] .open:focus-visible .flip{transform:rotateY(180deg)}}
/* 10 Numeral */
[data-card="10"] .ph{background:var(--bg)}
.numeral{display:none}
[data-card="10"] .numeral{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(60px,40cqw,170px)/1 "Bodoni Moda",serif;letter-spacing:-.05em;color:var(--c2);opacity:.5;transition:opacity .6s,transform 1s var(--ease)}
[data-card="10"] .tx{display:block;padding-top:10px;border-top:1px solid var(--rule)}
[data-card="10"] .nm{font-size:clamp(20px,9cqw,27px)}
@media(hover:hover){[data-card="10"] .card:hover .numeral{opacity:.95;transform:scale(1.08)}}

/* ---------- 10 layouts ---------- */
/* 1 Grid: four across on a laptop, two on a phone */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:clamp(18px,2.6vw,44px) clamp(12px,1.8vw,30px);--cw:max(158px,20vw)}
[data-card="5"] .grid{--cw:max(290px,28vw)}
/* 2 Mosaic: every sixth drink takes the stage */
.grid.mosaic{--cw:max(150px,16vw);grid-auto-flow:dense}
.card.big{grid-column:span 2}
.card.big .nm{font-size:clamp(30px,6.5cqw,64px)!important}
[data-card="5"] .grid.mosaic{--cw:max(290px,26vw)}
[data-card="5"] .card.big{grid-column:auto}
/* 3 Shelves: the back bar, one shelf per base */
.shelf{margin:0 0 clamp(26px,4vw,56px)}
.shelf h2,.dec h2{font:500 clamp(28px,3.2vw,44px)/1 "Bodoni Moda",serif;letter-spacing:-.025em;margin:0 0 14px;display:flex;align-items:baseline;gap:10px}
.shelf h2 small,.dec h2 small{font:500 13px "Schibsted Grotesk",sans-serif;color:var(--fg2);letter-spacing:0}
.row{display:flex;gap:clamp(12px,1.5vw,22px);overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*var(--gut));padding:0 var(--gut) 20px;scroll-padding:0 var(--gut);scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row .card{flex:0 0 clamp(150px,40vw,250px);scroll-snap-align:start}
[data-card="5"] .row .card{flex-basis:clamp(290px,82vw,420px)}
.rail{height:2px;margin:-6px 0 0;border-radius:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--c) 70%,#fff 10%) 15%,color-mix(in srgb,var(--c) 70%,#fff 10%) 85%,transparent);box-shadow:0 -10px 30px 2px color-mix(in srgb,var(--c) 40%,transparent)}
/* 4 Feed: one drink per screen */
html.snap{scroll-snap-type:y mandatory;scroll-padding-top:var(--navh)}
.feed{list-style:none;margin:-18px calc(-1*var(--gut)) 0;padding:0}
.fd{position:relative;min-height:calc(100svh - var(--navh));scroll-snap-align:start;display:grid;overflow:hidden;--gi:50}
.fd .bg{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 70%,color-mix(in srgb,var(--c) 45%,transparent),transparent 70%),var(--bg)}
.fd .bg img{width:100%;height:100%;object-fit:cover;mix-blend-mode:lighten}
.fd .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(3,2,2,0) 45%,rgba(3,2,2,.92) 82%)}
.fd .ft{position:relative;z-index:1;align-self:end;padding:0 var(--gut) clamp(30px,7vh,72px)}
.fd .nm{font-size:clamp(58px,16vw,150px);line-height:.86;letter-spacing:-.035em;margin:0}
.fd .ln{font-size:14px;margin:0 0 12px;white-space:normal}
.fd .tsp{display:block;font-size:15px;line-height:1.5;margin:18px 0 20px}
.acts{display:flex;align-items:center;gap:10px}
.acts .qa{position:static;width:52px;height:52px;border-radius:26px}
.acts .pill{height:52px;border-radius:26px;padding:0 26px}
@media(min-width:900px){.fd{grid-template-columns:1fr 1fr}.fd .bg{position:relative;inset:auto}.fd .bg::after{background:linear-gradient(90deg,rgba(3,2,2,0) 70%,var(--bg))}.fd .ft{align-self:center;padding-right:clamp(32px,6vw,96px)}.fd .nm{font-size:clamp(64px,7.5vw,140px)}}
/* 5 Index: the names are the menu */
.index{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.ix{position:relative;border-bottom:1px solid var(--rule);--gi:50}
.ix .open{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px;width:100%;padding:12px 52px 12px 0;border:0;background:none;text-align:left;color:inherit}
.ix .th{width:58px;border-radius:4px}
.ix .nm{font-size:clamp(30px,7vw,92px);line-height:1.02;letter-spacing:-.03em}
.ix .tx{min-width:0}
.ix .qa{top:50%;right:0;margin-top:-18px}
@media(hover:hover) and (min-width:700px){
  .ix .th{display:none}.ix .open{grid-template-columns:1fr;padding:clamp(10px,1.2vw,16px) 64px clamp(10px,1.2vw,16px) 0}
  .ix .tx{display:flex;align-items:baseline;justify-content:space-between;gap:24px}.ix .ln{margin:0;flex:none}
  .ix .open:hover .nm{transform:translateX(18px);color:var(--c2)}
}

};

const L = o => o ? (o[lang] || o.en) : '';

const $ = s => document.querySelector(s);

  fwd:'<svg class="i" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',

  check:'<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  slip:'<svg class="i" viewBox="0 0 24 24"><path d="M6 3h12v18l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5L6 21z"/><path d="M9 8h6M9 12h6"/></svg>'
};

/* ---- model (same rules as the live finder) ---- */
const SPIRIT = {gin:['gin','old-tom-gin'],vodka:['vodka','vodka-citron','vodka-vanilla'],
  rum:['white-rum','gold-rum','aged-rum','dark-rum','black-rum','demerara-rum','martinique-rum','overproof-rum','aguardiente','cachaca'],
  agave:['tequila','tequila-reposado','mezcal'],whisky:['bourbon','rye','scotch','islay','irish'],brandy:['cognac','brandy','calvados','pisco','grappa']};
const ID2SP = {}; Object.entries(SPIRIT).forEach(([g,ids])=>ids.forEach(i=>ID2SP[i]=g));
const BASES = ['gin','vodka','rum','agave','whisky','brandy','wine','liqueur'];
const ALLERGY = Object.keys(COMP).filter(k=>COMP[k].quick);
const VEGAN = ['egg','milk','honey','fish'];
const PANTRY = new Set(['water','sugar','sugar-cube','simple','soda','salt','pepper']);
const FACETS = [ // key, values, drink -> values
 ['base', BASES, d=>[d.base]],
 ['flav', ['sour','sweet','bitter','spirit','fruity','fresh','creamy','sparkling','herbal','smoky','spicy','tropical','minty','coffee','savoury','silky','nutty','floral','dry'], d=>d.flav||[]],
 ['str', ['light','mid','strong'], d=>[d.str]],
 ['tech', ['shake','stir','build','blend','muddle','swizzle'], d=>d.tech],
 ['ggroup', ['stem','low','tall','flute','wine','mug'], d=>[d.ggroup]],
 ['ice', ['up','cubes','crushed','cracked','blended','none','hot'], d=>[d.ice]],
 ['purpose', ['aperitivo','refrescante','digestivo'], d=>d.purpose?[d.purpose]:[]],
 ['cat', ['unforgettables','contemporary','newera'], d=>[d.cat]],
 ['era', ['pre','early','mid','now'], d=>[d.era]],
];
function lineVol(l){
  const n = parseFloat(String(l.q).split(/[-/]/)[0]) || (l.q===''?1:0);
  const m = {ml:1,dash:.8,'bar spoon':5,teaspoon:5,tablespoon:15,drops:.05};
  if (l.u==='ml'){ const q=String(l.q); if(q.includes('-')){const [a,b]=q.split('-').map(parseFloat);return (a+b)/2;} return parseFloat(q)||0; }
  if (l.u==='top up') return 60; if (l.u==='fill up') return 100; if (l.u==='splash') return 20; if (l.u==='shot') return 30;
  if (l.u==='piece') return {'lime-fruit':25,'egg-white':30}[l.ids[0]]||0;
  if (l.u in m) return n*m[l.u]; return 0;
}
function compsOf(ids){ const out={}; ids.forEach(id=>{ const g=ING[id]; if(!g) return;
  Object.entries(g.c).forEach(([c,lv])=>{ let k=c; while(k){ out[k]=Math.max(out[k]||0,lv); k=COMP[k]&&COMP[k].parent; } }); }); return out; }
function lift(hex, k){ const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)); return '#'+c.map(v=>Math.round(v+(255-v)*k).toString(16).padStart(2,'0')).join(''); }
const DR = DATA.drinks.map(dr=>{
  dr.lines.forEach(l=>{ l.vol=l.opt?0:lineVol(l); l.c=compsOf(l.ids); });
  dr.lev={}; dr.via={}; dr.optLev={};
  dr.lines.forEach(l=>Object.entries(l.c).forEach(([c,lv])=>{
    if (l.opt){ dr.optLev[c]=Math.max(dr.optLev[c]||0,lv); return; }
    dr.lev[c]=Math.max(dr.lev[c]||0,lv); (dr.via[c]=dr.via[c]||[]).push({id:l.ids[0],lv}); }));
  if (dr.lines.some(l=>!l.opt && l.ids.some(i=>!ING[i]))) dr.lev.__unknown=1;
  dr.idset = new Set(dr.lines.filter(l=>!l.opt).flatMap(l=>l.ids));
  let best=null,bestSp=null;
  dr.lines.forEach(l=>{ if(l.opt) return; const g=ING[l.ids[0]]; if(!g||!g.abv) return; const a=l.vol*g.abv;
    const grp=ID2SP[l.ids[0]]||(g.kind==='wine'?'wine':'liqueur'); if(!best||a>best.a) best={a,g:grp}; if(ID2SP[l.ids[0]]&&(!bestSp||a>bestSp.a)) bestSp={a,g:grp}; });
  dr.base = bestSp&&best&&bestSp.a>=.4*best.a ? bestSp.g : (best?best.g:'liqueur');
  dr.col = COLORS[dr.id] || '#8a6a4a'; dr.c2 = lift(dr.col,.28);
  dr.nIng = dr.lines.filter(l=>!l.opt && l.ids[0]!=='water').length;
  dr.era = dr.year<1900?'pre':dr.year<1946?'early':dr.year<2000?'mid':'now';
  dr.str = dr.abv<12?'light':dr.abv<=22?'mid':'strong';
  dr.ggroup = GLASS[dr.glass] ? GLASS[dr.glass].g : 'stem';
  const f = new Set(dr.flav||[]);
  dr.purpose = (dr.ggroup==='tall' || dr.vol>=150) ? 'refrescante'
    : (f.has('bitter') || f.has('dry')) ? 'aperitivo'
    : (f.has('creamy') || f.has('coffee') || (f.has('sweet') && !f.has('sour'))) ? 'digestivo'
    : (f.has('sparkling') && dr.abv<15) ? 'refrescante'
    : (f.has('spirit') || f.has('herbal')) ? 'aperitivo' : null;
  dr.search = (dr.name+' '+dr.lines.flatMap(l=>l.ids.map(i=>ING[i]?ING[i].en+' '+ING[i].es:i)).join(' ')).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  return dr;
});
const byId = Object.fromEntries(DR.map(d=>[d.id,d]));
Object.keys(ticket).forEach(k=>{ if(!byId[k]) delete ticket[k]; });
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
// level 1 declared only, 2 + common, 3 + possible (and unknown bottles)
const blocked = (d, comps) => comps.some(c => (d.lev[c]||0) >= 4-S.level || (S.level===3 && d.lev.__unknown));
function pass(d, skip){
  if (Q){ const ws=norm(Q).split(/\s+/).filter(Boolean); if(!ws.every(w=>d.search.includes(w))) return false; }
  const ex = S.leave.concat(S.vegan?VEGAN:[]);
  if (ex.length && blocked(d, ex)) return false;
  for (const tk of S.toks){
    const has = tk.type==='ing' ? d.idset.has(tk.id) || (SPIRIT[tk.id]||[]).some(i=>d.idset.has(i)) : (d.lev[tk.id]||0) >= (tk.mode==='exc' ? 4-S.level : 3);
    if (tk.mode==='inc' && !S.mybar && !has) return false;
    if (tk.mode==='exc' && has) return false;
  }
  if (S.mybar){
    const have = new Set(S.toks.filter(x=>x.mode==='inc'&&x.type==='ing').flatMap(x=>SPIRIT[x.id]||[x.id]));
    if (!d.lines.every(l=>l.opt || PANTRY.has(l.ids[0]) || l.ids.some(i=>have.has(i)))) return false;
  }
  for (const [k,,get] of FACETS){ if (k===skip || !S[k].length) continue; if (!get(d).some(v=>S[k].includes(v))) return false; }
  return true;
}
const facetCount = (k, v, get) => DR.filter(d=>pass(d,k) && get(d).includes(v)).length;
const activeCount = () => S.leave.length + (S.vegan?1:0) + S.toks.length + (S.mybar?1:0) + FACETS.reduce((n,[k])=>n+S[k].length,0);
const SORTS = {az:(a,b)=>a.name.localeCompare(b.name), light:(a,b)=>a.abv-b.abv, strong:(a,b)=>b.abv-a.abv, old:(a,b)=>a.year-b.year, new:(a,b)=>b.year-a.year, few:(a,b)=>a.nIng-b.nIng||a.name.localeCompare(b.name)};
const results = () => DR.filter(d=>pass(d)).sort(SORTS[sort]||SORTS.az);
const uName = u => UNIT[u] ? UNIT[u][lang==='es'?1:0] : u;
function toOz(x){ const v=Math.round(x/30*4)/4, w=Math.floor(v), fr={0:'',0.25:'¼',0.5:'½',0.75:'¾'}[v-w]; return (w||!fr?w:'')+fr; }
function fmtQty(l){ if (l.u==='ml') return units==='oz' ? String(l.q).split('-').map(x=>toOz(parseFloat(x))).join('–')+' oz' : String(l.q).replace('-','–')+' ml'; if (!l.q) return uName(l.u); return `${l.q} ${uName(l.u)}`.trim(); }

const lineLabel = l => l.ids.map(ingName).join(` ${t().or} `);
const techStr = d => d.tech.map(x=>t().techs[x]).join(' + ');
const glassName = d => GLASS[d.glass]?L(GLASS[d.glass]):d.glass;
const metaLine = d => [t().bases[d.base], techStr(d), Math.round(d.abv)+'%'].join(' · ');

/* ---- review variants (temporary, until Fede picks) ---- */
const qp = new URLSearchParams(location.search);
const CARDS = {
  '1':{ar:4/5,f:.6,cy:.47,name:'Backlit'}, '2':{ar:3/4,f:.72,cy:.52,name:'Plinth'}, '3':{ar:1,f:.74,cy:.5,name:'Sheet'},
  '4':{ar:3/4,f:.6,cy:.4,name:'Poster'}, '5':{ar:4/5,f:.76,cy:.5,name:'Spec'}, '6':{ar:3/4,f:.58,cy:.38,name:'Frosted'},
  '7':{ar:1,f:.7,cy:.5,name:'Coaster'}, '8':{ar:4/5,f:.66,cy:.5,name:'Label'}, '9':{ar:3/4,f:.66,cy:.48,name:'Flip'},
  '10':{ar:4/5,f:.64,cy:.5,name:'Numeral'}};
const LAYOUTS = {
  '1':{name:'Grid'}, '2':{name:'Mosaic'}, '3':{name:'Shelves'}, '4':{name:'Feed',own:1}, '5':{name:'Index',own:1},
  '6':{name:'Carousel'}, '7':{name:'Timeline'}, '8':{name:'Deck'}, '9':{name:'Split',own:1}, '10':{name:'Colour wall',own:1}};
let CARD = qp.get('card') || store.get('rev2.card','1'); if(!CARDS[CARD]) CARD='1';
let LAYOUT = qp.get('layout') || store.get('rev2.layout','1'); if(!LAYOUTS[LAYOUT]) LAYOUT='1';
let rvOpen = false;
// place the photo so the glass fills f of the box height, centred at (.5, cy); never shows past the photo's edges
function crop(d, v=CARDS[CARD]){
  const A=v.ar, [x0,y0,x1,y1]=FRAMES[d.id]||[.3,.3,.7,.85];
  let W = v.f/(A*1.5*Math.max(.2,y1-y0));
  W = Math.min(W, .82/Math.max(.1,x1-x0));
  // a tall glass may need the photo smaller than the box: then its edges are feathered into the card
  const cover = Math.max(1, 1/(1.5*A)), fe = W < cover; W = Math.max(W, cover*.78);
  const H = 1.5*W, bh = 1/A, cl = (x,a,b) => Math.min(Math.max(x,Math.min(a,b)),Math.max(a,b));
  const l = cl(.5-(x0+x1)/2*W, 0, 1-W);
  const tp = cl(v.cy*bh-(y0+y1)/2*H, 0, bh-H);
  return `${fe?'fe':''}" style="--w:${W.toFixed(3)};--l:${l.toFixed(3)};--t:${(tp/bh).toFixed(3)}`;
}
function renderRev(){
  const tt=t();
  const step=(k,map,cur,dis)=>{ const ks=Object.keys(map), i=ks.indexOf(cur);
    return `<div class="rvrow${dis?' dis':''}"><span><span class="rvl">${k==='layout'?tt.layoutL:tt.cards}</span><span class="rvn"><span class="num">${i+1}/${ks.length}</span> ${map[cur].name}</span></span>
      <button type="button" class="iconbtn" data-rvstep="${k}:-1" aria-label="${tt.prev}" ${dis?'disabled':''}>${ICON.back}</button><button type="button" class="iconbtn" data-rvstep="${k}:1" aria-label="${tt.next}" ${dis?'disabled':''}>${ICON.fwd}</button></div>`; };
  $('#rv').innerHTML = (rvOpen?`<div class="rvp">${step('layout',LAYOUTS,LAYOUT)}${step('card',CARDS,CARD,LAYOUTS[LAYOUT].own)}<button type="button" class="txtbtn" data-rvreplay>${tt.replay}</button></div>`:'')
    + `<button type="button" class="rvbtn" data-rvtoggle aria-expanded="${rvOpen}">${tt.review}</button>`;
}

    const pl=$('#sheet .plate'), h=$('#sheet .head h2'); if(pl) pl.style.viewTransitionName='hero'; if(h) h.style.viewTransitionName='hnm'; });

// quick add: a drop of the drink's colour arcs into the ticket
function fly(from, d){
  const tab=$('#tab'); if(!from || !tab || tab.hidden || !document.body.animate || reduced()){ renderTab(true); return; }
  const a=from.getBoundingClientRect(), b=tab.getBoundingClientRect();
  const x0=a.left+a.width/2, y0=a.top+a.height/2, x1=b.left+b.width/2, y1=b.top+b.height/2;
  const dot=document.createElement('i'); dot.className='fly'; dot.style.background=d.c2; dot.style.boxShadow=`0 0 22px 4px ${d.col}`; document.body.appendChild(dot);
  dot.animate([{transform:`translate(${x0}px,${y0}px) scale(.6)`},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-140}px) scale(1.5)`,offset:.45},{transform:`translate(${x1}px,${y1}px) scale(.3)`,opacity:.7}],
    {duration:700,easing:'cubic-bezier(.45,0,.25,1)'}).finished.then(()=>{ dot.remove(); renderTab(true); });
}

  let done=false;

    <div class="fhead"><h2>${tt.filters}</h2><div class="acts">${activeCount()?`<button type="button" class="txtbtn" id="fclear">${tt.clearAll}</button>`:''}<button type="button" class="iconbtn" id="fclose" aria-label="${esc(tt.back)}">${ICON.close}</button></div></div>
    <div class="fbody">${filterBody()}</div>
    <div class="ffoot"><button type="button" class="pill solid" id="fshow">${tt.show(n)}</button></div></div>`;
  fs.querySelector('.fbody').scrollTop = st;
  if (foc){ const ni=$('#tokin'); ni.value=val; ni.focus(); suggest(); }
}
function suggest(){
  const box=$('#sugg'), q=norm($('#tokin').value); if(!q){ box.innerHTML=''; return; }
  const tt=t(), items=[], used=new Set(S.toks.map(x=>x.type+x.id));
  Object.keys(SPIRIT).forEach(g=>{ if(norm(tt.bases[g]).includes(q)) items.push({type:'ing',id:g,label:tt.bases[g],k:tt.kSpirit}); });
  Object.entries(COMP).forEach(([id,c])=>{ if(norm(c.en).includes(q)||norm(c.es).includes(q)) items.push({type:'comp',id,label:L(c),k:tt.kComp}); });
  Object.entries(ING).forEach(([id,i])=>{ if(norm(i.en).includes(q)||norm(i.es).includes(q)) items.push({type:'ing',id,label:L(i),k:tt.kIng}); });
  box.innerHTML = items.filter(x=>!used.has(x.type+x.id)).slice(0,8).map(x=>`<button type="button" data-addtok="${x.type}:${x.id}">${esc(x.label)}<small>${esc(x.k)}</small></button>`).join('');
}
function openFilters(push=true){ $('#fs').hidden=false; document.body.style.overflow='hidden'; renderFilters(); if(push) history.pushState({f:1},''); $('#fclose').focus({preventScroll:true}); }
function closeFilters(pop=false){ if($('#fs').hidden) return; $('#fs').hidden=true; if($('#sheet').hidden && $('#cmd').hidden) document.body.style.overflow='';
  if(!pop && history.state && history.state.f) history.back(); const b=$('#fopen'); if(b) b.focus({preventScroll:true}); }
function changed(){ saveS(); renderChrome(); vt(renderList); renderFilters(); }

/* ---- drink page ---- */
function detail(d){
  const tt=t(); const on = !!ticket[d.id];
  const sub = l => { const n = lang==='es'?l.n_es:l.n_en; return [n, l.opt?tt.opt:''].filter(Boolean).join(' · '); };
  const lines = d.lines.map(l=>`<div class="ln ${l.opt?'opt':''}"><span class="q">${esc(fmtQty(l))}</span><span class="i">${esc(lineLabel(l))}${sub(l)?`<small>${esc(sub(l))}</small>`:''}</span></div>`).join('');
  const pv = d.lines.filter(l=>l.vol>=1);
  const ratio = `<div class="ratio" aria-hidden="true">${pv.map((l,i)=>`<i style="flex:${l.vol};opacity:${1-i*(.7/Math.max(1,pv.length-1))}"></i>`).join('')}</div>`;
  return `<div class="dwrap" style="--c:${d.col};--c2:${d.c2}">
    <div class="plate"><img src="${photo(d)}" alt="${esc(d.name)}" style="object-position:${platePos(d)}"></div>
    <div class="dcol"><div class="head"><h2>${esc(d.name)}</h2><div class="orig">${esc([d.year,d.place].filter(Boolean).join(' · '))}</div></div>
    <div class="pour"><div class="units"><div class="seg" role="group" aria-label="${esc(tt.unitsL)}"><button type="button" data-u="ml" aria-pressed="${units==='ml'}">ML</button><button type="button" data-u="oz" aria-pressed="${units==='oz'}">OZ</button></div></div>${ratio}${lines}</div>
    <button class="pill add${on?'':' solid'}" type="button" data-add="${d.id}" aria-pressed="${on}">${on?ICON.check+tt.added+` ×${ticket[d.id]}`:ICON.plus+tt.add}</button>
    <dl class="facts">
      <div><dt>${tt.glass}</dt><dd>${esc(glassName(d))}</dd></div>
      <div><dt>${tt.ice}</dt><dd>${esc(tt.ices[d.ice]||'')}</dd></div>
      <div><dt>${tt.tech}</dt><dd>${esc(techStr(d))}</dd></div>
      <div><dt>${tt.abv}</dt><dd>≈ ${Math.round(d.abv)}%</dd></div></dl>
    ${containsHTML(d)}
    <div class="prose">
      <h3>${tt.method}</h3><p>${esc(L(d.method))}</p>
      ${L(d.garnish)?`<h3>${tt.garnish}</h3><p>${esc(L(d.garnish))}</p>`:''}
      ${L(d.history)?`<h3>${tt.story}</h3><p>${esc(L(d.history))}</p>`:''}
      ${d.video?`<div class="video" id="vid"><button type="button" class="pill" data-play="${esc(d.video)}">${ICON.play}${tt.play}</button>
        <a class="ext" href="https://www.youtube.com/watch?v=${esc(d.video)}" target="_blank" rel="noopener">${tt.watch}</a></div>`:''}</div></div></div>`;
}

function platePos(d){ const [x0,y0,x1,y1]=FRAMES[d.id]||[.3,.3,.7,.85]; return `${Math.round((x0+x1)*50)}% ${Math.round(Math.min(.62,(y0+y1)/2)*100)}%`; }
function containsHTML(d){
  const tt=t();
  const via = c => { const m={}; (d.via[c]||[]).forEach(v=>{ const n=ingName(v.id); m[n]=Math.max(m[n]||0,v.lv); }); return Object.keys(m).join(', '); };
  const al = ALLERGY.concat(['honey']).filter(c=>d.lev[c]).sort((a,b)=>d.lev[b]-d.lev[a]);
  const rows = al.map(c=>`<li><span>${esc(L(COMP[c]))}</span><small>${esc(via(c))} · ${tt.lvName[3-d.lev[c]]}</small></li>`).join('');
  const opt = ALLERGY.filter(c=>!d.lev[c] && (d.optLev[c]||0)>=2).map(c=>`<li><span>${esc(L(COMP[c]))}</span><small>${tt.optOnly}</small></li>`).join('');
  return `<section class="contains"><h3>${tt.contains}</h3>${rows||opt?`<ul>${rows}${opt}</ul>`:`<p class="none">${tt.noAllergens}</p>`}</section>`;
}

/* ---- the ticket (comanda): drinks × covers -> mise en place ---- */
function miseEnPlace(){
  const ml={}, units={}, glass={}, garn=[]; let drinks=0;
  Object.entries(ticket).forEach(([id,n])=>{ const d=byId[id]; drinks+=n;
    glass[glassName(d)]=(glass[glassName(d)]||0)+n;
    if (L(d.garnish)) garn.push([L(d.garnish), n]);
    d.lines.forEach(l=>{ if(l.opt) return; const k=l.ids[0];
      if (l.u==='ml'){ ml[k]=(ml[k]||0)+l.vol*n; return; }
      // spoons share one measure so the same ingredient adds up on one line
      const sp = {teaspoon:1,'bar spoon':1,tablespoon:3}[l.u]; const u = sp ? 'bar spoon' : l.u;
      const key=k+'|'+u; const q=parseFloat(String(l.q).split(/[-/]/)[0]);
      units[key]=(units[key]||0)+(isNaN(q)?1:q)*(sp||1)*n; });
  });
  return {ml, units, glass, garn, drinks};
}
let printed = 0;
function renderTicket(print){
  const tt=t(); const m=miseEnPlace(); const ids=Object.keys(ticket);
  if (!ids.length){ closeTicket(); return; }
  const now = new Date(); const hhmm = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const rows = ids.map(id=>{ const d=byId[id]; return `<div class="s-row"><div><button class="nm" type="button" data-id="${id}">${esc(d.name)}</button><small>${esc(glassName(d))} · ${esc(tt.ices[d.ice]||'')}</small></div>
    <div class="step"><button type="button" data-step="${id}" data-dv="-1" aria-label="${tt.less}: ${esc(d.name)}">${ICON.minus}</button><output class="num">${ticket[id]}</output><button type="button" data-step="${id}" data-dv="1" aria-label="${tt.more}: ${esc(d.name)}">${ICON.plus}</button></div></div>`; }).join('');
  const mlRows = Object.entries(m.ml).sort((a,b)=>b[1]-a[1]).map(([id,v])=>`<tr><td class="q num">${fmtN(v)} ml</td><td>${esc(ingName(id))}</td></tr>`).join('');
  const uRows = Object.entries(m.units).map(([k,v])=>{ const [id,u]=k.split('|'); const ux=uName(u)+(lang==='en'&&v>1&&['bar spoon','dash'].includes(u)?'s':'');
    return `<tr><td class="q num">${['top up','fill up'].includes(u)?ux:fmtN(v)+(ux?' '+ux:'')}</td><td>${esc(ingName(id))}</td></tr>`; }).join('');
  const gRows = Object.entries(m.glass).sort((a,b)=>b[1]-a[1]).map(([g,n])=>`<tr><td>${esc(g)}</td><td class="r num">×${n}</td></tr>`).join('');
  const garRows = m.garn.map(([g,n])=>`<tr><td>${esc(g)}</td><td class="r num">×${n}</td></tr>`).join('');
  $('#cmd').innerHTML = `<button class="close" type="button" id="ccls" aria-label="${tt.back}">${ICON.close}</button>
    <div class="slip${print?' print':''}">
      <div class="s-head"><h2>${tt.ticket}</h2><span class="num">${hhmm}</span></div>
      ${rows}
      <section class="s-sec"><h3>${tt.mise}</h3><table>${mlRows}${uRows}</table></section>
      <section class="s-sec"><h3>${tt.glassware}</h3><table>${gRows}</table></section>
      ${garRows?`<section class="s-sec"><h3>${tt.garnishes}</h3><table>${garRows}</table></section>`:''}
      <div class="s-foot"><span class="tot num">${tt.drinksN(m.drinks)}</span><button type="button" id="cclr">${tt.clearT}</button></div>
    </div>`;
}
function openTicket(push=true){ $('#cmd').hidden=false; document.body.style.overflow='hidden'; renderTicket(true); renderTab();
  $('#cmd').setAttribute('aria-label', t().ticket); if(push) history.pushState({c:1},'','#'+(lang==='es'?'comanda':'ticket')); $('#ccls').focus({preventScroll:true}); }
function closeTicket(pop=false){ if($('#cmd').hidden) return; $('#cmd').hidden=true; if($('#sheet').hidden) document.body.style.overflow='';
  if(!pop && history.state && history.state.c) history.back(); renderTab(); }
function setCovers(id, n){ if(n<=0) delete ticket[id]; else ticket[id]=Math.min(n,99); store.set('ticket',ticket); renderTab(); markCard(id); }

/* ---- navigation ---- */
let openId = null;
function open(id, push=true){
  const d = byId[id]; if(!d) return;
  if (!$('#cmd').hidden) closeTicket(true);
  openId=id; const s=$('#sheet'); document.body.style.setProperty('--dot', d.c2);
  s.innerHTML = `<button class="close" type="button" id="cls" aria-label="${t().back}">${ICON.back}</button>` + detail(d);
  s.hidden=false; s.scrollTop=0; document.body.style.overflow='hidden'; s.setAttribute('aria-label', d.name);
  if (push) history.pushState({d:id}, '', '#'+id);
  $('#cls').focus({preventScroll:true});
}
function close(pop=false){ if(openId===null) return; const id=openId; openId=null; $('#sheet').hidden=true; document.body.style.overflow='';
  if(!pop && history.state && history.state.d) history.back();
  const b=document.querySelector(`.open[data-id="${id}"]`); if(b) b.focus({preventScroll:true}); }
function all(){ renderChrome(); renderList(); renderTab(); if(openId) open(openId,false); if(!$('#cmd').hidden) renderTicket(false); }

document.addEventListener('click', e=>{
  const fc=e.target.closest('[data-f]'); if(fc){ const k=fc.dataset.f,v=fc.dataset.v; S[k]=S[k].includes(v)?S[k].filter(x=>x!==v):[...S[k],v]; changed(); return; }
  const lv=e.target.closest('[data-leave]'); if(lv){ const c=lv.dataset.leave; S.leave=S.leave.includes(c)?S.leave.filter(x=>x!==c):[...S.leave,c]; changed(); return; }
  if(e.target.closest('[data-vegan]')){ S.vegan=!S.vegan; changed(); return; }
  const lvl=e.target.closest('[data-level]'); if(lvl){ S.level=+lvl.dataset.level; changed(); return; }
  const at=e.target.closest('[data-addtok]'); if(at){ const [type,id]=at.dataset.addtok.split(':'); S.toks.push({type,id,mode:'inc'}); $('#tokin').value=''; changed(); $('#tokin').focus(); return; }
  const tm=e.target.closest('[data-tokmode]'); if(tm){ const tk=S.toks[+tm.dataset.tokmode]; tk.mode=tk.mode==='inc'?'exc':'inc'; changed(); return; }
  const td=e.target.closest('[data-tokdel]'); if(td){ S.toks.splice(+td.dataset.tokdel,1); changed(); return; }
  const so=e.target.closest('[data-sort]'); if(so){ sort=so.dataset.sort; store.set('sort',sort); changed(); return; }
  const rm=e.target.closest('[data-rm]'); if(rm){ const [k,v]=rm.dataset.rm.split(':');
    if(k==='leave') S.leave=S.leave.filter(x=>x!==v); else if(k==='vegan') S.vegan=false; else if(k==='mybar') S.mybar=false; else if(k==='tok') S.toks.splice(+v,1); else S[k]=S[k].filter(x=>x!==v);
    changed(); return; }
  if(e.target.closest('#fopen')){ openFilters(); return; }
  if(e.target.closest('#fclose') || e.target.closest('#fshow') || e.target===$('#fs')){ closeFilters(); return; }
  if(e.target.closest('#fclear')){ S=blank(); changed(); return; }
  const pl=e.target.closest('[data-play]'); if(pl){ const f=document.createElement('iframe');
    f.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(pl.dataset.play)}?autoplay=1&playsinline=1&rel=0`;
    f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen'; f.allowFullscreen=true; f.title=byId[openId]?byId[openId].name:'Video';
    pl.replaceWith(f); return; }
  const un=e.target.closest('[data-u]'); if(un){ units=un.dataset.u; store.set('units',units); open(openId,false); return; }
  const a=e.target.closest('[data-add]'); if(a){ const id=a.dataset.add; setCovers(id, (ticket[id]||0)+1); if(a.dataset.quick){ markCard(id,true); fly(a, byId[id]); } else { open(id,false); renderTab(true); } return; }
  const rs=e.target.closest('[data-rvstep]'); if(rs){ const [k,dv]=rs.dataset.rvstep.split(':'); const map=k==='card'?CARDS:LAYOUTS, ks=Object.keys(map), cur=k==='card'?CARD:LAYOUT;
    const nv=ks[(ks.indexOf(cur)+(+dv)+ks.length)%ks.length]; if(k==='card'){ CARD=nv; store.set('rev2.card',nv); } else { LAYOUT=nv; store.set('rev2.layout',nv); }
    renderRev(); scrollTo(0,0); vt(renderList); return; }
  if(e.target.closest('[data-rvtoggle]')){ rvOpen=!rvOpen; renderRev(); return; }
  if(e.target.closest('[data-rvreplay]')){ rvOpen=false; renderRev(); scrollTo(0,0); intro(true); return; }
  const cb=e.target.closest('[data-car]'); if(cb){ const c=$('#car'); if(c) c.scrollBy({left:(+cb.dataset.car)*c.firstElementChild.offsetWidth,behavior:reduced()?'auto':'smooth'}); return; }
  const db=e.target.closest('[data-deck]'); if(db){ deckAct(db.dataset.deck); return; }
  const st=e.target.closest('[data-step]'); if(st){ setCovers(st.dataset.step, (ticket[st.dataset.step]||0)+(+st.dataset.dv)); renderTicket(false); return; }
  if(e.target.closest('#tab')){ openTicket(); return; }
  if(e.target.closest('#ccls')){ closeTicket(); return; }
  if(e.target.closest('#cclr')){ ticket={}; store.set('ticket',ticket); renderList(); closeTicket(); return; }
  const o=e.target.closest('[data-id]'); if(o){ if(dragMoved && o.closest('.dk')) return; heroOpen(o.dataset.id, o); return; }
  if(e.target.closest('#cls')){ heroClose(); return; }
  if(e.target.closest('#clr')){ S=blank(); Q=''; saveS(); $('#q').value=''; $('#qx').hidden=true; all(); return; }
  const l=e.target.closest('[data-l]'); if(l){ lang=l.dataset.l; store.set('lang',lang); all(); return; }
  if(e.target===$('#cmd')) closeTicket();
});
$('#q').addEventListener('input', e=>{ Q=e.target.value; $('#qx').hidden=!Q; renderList(); });
$('#qx').addEventListener('click', e=>{ e.preventDefault(); Q=''; $('#q').value=''; $('#qx').hidden=true; renderList(); $('#q').focus(); });
document.addEventListener('input', e=>{ if(e.target.id==='tokin') suggest(); });
document.addEventListener('securitypolicyviolation', e=>{ if(!/frame/.test(e.violatedDirective)) return; const f=document.querySelector('.video iframe'); if(f) f.remove(); });
document.addEventListener('change', e=>{ if(e.target.id==='mybar'){ S.mybar=e.target.checked; changed(); } });
document.addEventListener('keydown', e=>{ if(e.target.id==='tokin' && e.key==='Enter'){ const f=$('#sugg button'); if(f){ e.preventDefault(); f.click(); } } });
document.addEventListener('keydown', e=>{ if(e.key!=='Escape') return; if(!$('#fs').hidden) closeFilters(); else if(!$('#cmd').hidden) closeTicket(); else if(openId) heroClose(); });
let lastY=0; $('#sheet').addEventListener('scroll', e=>{ const y=e.target.scrollTop, c=$('#cls'); if(c) c.classList.toggle('away', y>lastY && y>120); lastY=y; }, {passive:true});
addEventListener('popstate', ()=>{ if(!$('#fs').hidden) closeFilters(true); else if(!$('#cmd').hidden) closeTicket(true); else if(openId) heroClose(true); });
document.addEventListener('keydown', e=>{ if(openId || !$('#fs').hidden || !$('#cmd').hidden || /INPUT/.test(e.target.tagName)) return;
  if(LAYOUT==='6' && /Arrow(Left|Right)/.test(e.key)){ const b=document.querySelector(`[data-car="${e.key==='ArrowLeft'?-1:1}"]`); if(b) b.click(); }
  if(LAYOUT==='8' && /Arrow(Left|Right)/.test(e.key)) deckAct(e.key==='ArrowLeft'?'skip':'add'); });
const hoverable = matchMedia('(hover:hover)');
document.addEventListener('mouseover', e=>{ if(!hoverable.matches) return;
  if(LAYOUT==='9'){ const r=e.target.closest('.srow'); if(r) pvSet(r.dataset.k); }
  if(LAYOUT==='5') { const r=e.target.closest('.ix'); floatSet(r?r.dataset.k:null); } });
document.addEventListener('pointermove', e=>{ if(LAYOUT==='5'){ const f=$('#float'); if(f){ f.style.left=e.clientX+'px'; f.style.top=e.clientY+'px'; } }
  if(drag){ drag.dx=e.clientX-drag.x; if(Math.abs(drag.dx)>6) dragMoved=true; drag.el.style.transform=`translateX(${drag.dx}px) rotate(${drag.dx/18}deg)`; drag.el.style.setProperty('--sw',Math.max(-1,Math.min(1,drag.dx/110)).toFixed(2)); } }, {passive:true});
document.addEventListener('pointerdown', e=>{ const top=e.target.closest('.stack .dtop'); if(!top) return; dragMoved=false; drag={el:top,x:e.clientX,dx:0}; top.style.transition='none'; top.classList.remove('hint'); });
const endDrag=()=>{ if(!drag) return; const {el,dx}=drag; drag=null; el.style.transition='';
  if(Math.abs(dx)>100) deckAct(dx>0?'add':'skip'); else { el.style.transform=''; el.style.setProperty('--sw',0); } setTimeout(()=>{ dragMoved=false; },0); };
document.addEventListener('dragstart', e=>{ if(e.target.closest && e.target.closest('.stack')) e.preventDefault(); });
document.addEventListener('pointerup', endDrag); document.addEventListener('pointercancel', endDrag);
addEventListener('scroll', ()=>{ if(LAYOUT==='9' && innerWidth<900) requestAnimationFrame(splitScroll); }, {passive:true});
if ('ResizeObserver' in window) new ResizeObserver(()=>document.documentElement.style.setProperty('--navh', $('#top').offsetHeight+'px')).observe($('#top'));
let wasNarrow = innerWidth<600; addEventListener('resize', ()=>{ if((innerWidth<600)!==wasNarrow){ wasNarrow=!wasNarrow; renderChrome(); } });
all();
if (!intro()) enter();
const h=location.hash.slice(1); if (h in byId) open(h,false); else if ((h==='ticket'||h==='comanda') && Object.keys(ticket).length) openTicket(false);
</script>
